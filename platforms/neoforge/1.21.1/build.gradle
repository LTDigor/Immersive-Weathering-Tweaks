plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144'
}

group = 'org.admany.iwt'
version = '1.3.1'

base {
    archivesName = 'immersive-weathering-tweaks-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = '21.1.219'
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java', '../../../common/src/main/java']
        resources.srcDirs = ['src/main/resources']
    }
}

dependencies {
    implementation 'maven.modrinth:AtjxBimt:n3NgrJOg'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    archiveFileName = "immersive-weathering-tweaks-neoforge-${project.version}.jar"
}
