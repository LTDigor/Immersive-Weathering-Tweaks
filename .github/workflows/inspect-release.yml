name: Verify NeoForge 1.21.1 no-QAPI branch

on:
  push:
    branches:
      - inspect-iwt-1.3.1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: remove-quantified-api-neoforge-1.21.1
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build NeoForge 1.21.1
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -p platforms/neoforge/1.21.1 build
      - name: Verify no Quantified API dependency remains
        shell: bash
        run: |
          set -euo pipefail
          JAR=platforms/neoforge/1.21.1/build/libs/immersive-weathering-tweaks-neoforge-1.3.1.jar
          test -f "$JAR"
          unzip -p "$JAR" META-INF/neoforge.mods.toml > /tmp/neoforge.mods.toml
          ! grep -qi 'quantified' /tmp/neoforge.mods.toml
          ! jar tf "$JAR" | grep -q 'org/admany/quantified'
          ! zipgrep -i 'org.admany.quantified' "$JAR"
          jar tf "$JAR" | grep -q 'org/admany/iwt/neoforge/IwtForge.class'
          jar tf "$JAR" | grep -q 'org/admany/iwt/mixin/neoforge/AreaCheckForgeMixin.class'
          jar tf "$JAR" | grep -q 'org/admany/iwt/mixin/neoforge/BlockGrowthHandlerForgeMixin.class'
          sha256sum "$JAR"
      - name: Upload verified jar
        uses: actions/upload-artifact@v4
        with:
          name: iwt-neoforge-1.21.1-no-qapi
          path: platforms/neoforge/1.21.1/build/libs/immersive-weathering-tweaks-neoforge-1.3.1.jar
          retention-days: 7
