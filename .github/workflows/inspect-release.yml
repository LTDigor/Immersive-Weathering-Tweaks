name: Inspect Seismica 1.7.0

on:
  push:
    branches:
      - inspect-iwt-1.3.1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download Seismica and CFR
        run: |
          set -euxo pipefail
          curl -L --fail -o /tmp/seismica.jar https://cursemaven.com/curse/maven/seismica-1609222/8717991/seismica-1609222-8717991.jar
          curl -L --fail -o /tmp/cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          sha256sum /tmp/seismica.jar
      - name: Decompile
        run: |
          set -euxo pipefail
          mkdir -p /tmp/seismica-decompiled
          java -jar /tmp/cfr.jar /tmp/seismica.jar --outputdir /tmp/seismica-decompiled --silent true
          jar tf /tmp/seismica.jar | sort > /tmp/jar-contents.txt
          unzip -p /tmp/seismica.jar META-INF/neoforge.mods.toml > /tmp/neoforge.mods.toml || true
          grep -RniE 'ServerTick|LevelTick|PlayerTick|TickEvent|onTick|setBlock|destroyBlock|FallingBlockEntity|sendTo|PacketDistributor|ChunkPos|for \(|while \(|getPlayers|allPlayers|save|SavedData|BlockPos|radius|tsunami|earthquake|collapse|fault' /tmp/seismica-decompiled > /tmp/hotspots.txt || true
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: seismica-1.7.0-review
          path: |
            /tmp/seismica.jar
            /tmp/seismica-decompiled
            /tmp/jar-contents.txt
            /tmp/neoforge.mods.toml
            /tmp/hotspots.txt
          retention-days: 1
