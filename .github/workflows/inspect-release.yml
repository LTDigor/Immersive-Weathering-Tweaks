name: Inspect IWT 1.3.1 release

on:
  push:
    branches:
      - inspect-iwt-1.3.1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download published 1.3.1 jar and CFR
        run: |
          set -euxo pipefail
          curl -L --fail -o /tmp/iwt.jar https://cursemaven.com/curse/maven/iwt-1607613/8844776/iwt-1607613-8844776.jar
          curl -L --fail -o /tmp/cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
      - name: Inspect and decompile
        run: |
          set -euxo pipefail
          mkdir -p /tmp/decompiled
          echo '=== NEOFORGE METADATA ==='
          unzip -p /tmp/iwt.jar META-INF/neoforge.mods.toml
          echo '=== NEOFORGE MIXINS ==='
          unzip -p /tmp/iwt.jar iwt-neoforge.mixins.json
          echo '=== MANIFEST ==='
          unzip -p /tmp/iwt.jar META-INF/MANIFEST.MF
          java -jar /tmp/cfr.jar /tmp/iwt.jar --outputdir /tmp/decompiled --silent true
      - name: Upload inspection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iwt-1.3.1-inspection
          path: |
            /tmp/iwt.jar
            /tmp/decompiled
          retention-days: 1
