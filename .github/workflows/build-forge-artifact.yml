name: Build Forge artifact

on:
  push:
    branches:
      - iwt-build-artifact

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Forge release JAR
        run: ./gradlew --no-daemon assembleForgeRelease

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/immersive-weathering-tweaks-forge-1.1.0.jar"
          test -f "$JAR"
          unzip -p "$JAR" META-INF/mods.toml > /tmp/mods.toml
          ! grep -qi 'quantified' /tmp/mods.toml
          ! jar tf "$JAR" | grep -q 'org/admany/quantified'
          sha256sum "$JAR"

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: immersive-weathering-tweaks-forge-no-qapi
          path: build/libs/immersive-weathering-tweaks-forge-1.1.0.jar
          if-no-files-found: error
          retention-days: 7
